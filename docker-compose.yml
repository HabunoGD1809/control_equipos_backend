x-runtime: &runtime
  build: .
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped
  environment: &environment
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Configure REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Configure REDIS_PASSWORD}@redis:6379/0
    REPORT_EXECUTION_MODE: celery
    UPLOADS_DIRECTORY: /home/app/uploads
    UV_CACHE_DIR: /tmp/uv-cache
    PORT: 8000
  volumes:
    - uploads_data:/home/app/uploads
    - logs_data:/home/app/logs
    - backups_data:/home/app/backups
  networks: [control_equipos_net]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
    restart: unless-stopped
    ports: ["127.0.0.1:${DATABASE_PUBLIC_PORT:-5433}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control_equipos_net]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD}
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Configure REDIS_PASSWORD}']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [control_equipos_net]
  backend:
    <<: *runtime
    environment:
      <<: *environment
      APP_COMPONENT: backend
    command: [uv, run, --frozen, --no-sync, uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    ports: ["127.0.0.1:${BACKEND_PUBLIC_PORT:-8086}:8000"]
    healthcheck:
      test: [CMD, /home/app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *runtime
    environment:
      <<: *environment
      APP_COMPONENT: worker
    command: [uv, run, --frozen, --no-sync, celery, -A, app.worker.celery_app, worker, --loglevel=info, --concurrency=2]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    <<: *runtime
    environment:
      <<: *environment
      APP_COMPONENT: beat
    command: [uv, run, --frozen, --no-sync, celery, -A, app.worker.celery_app, beat, -s, /tmp/celerybeat-schedule, --pidfile=/tmp/celerybeat.pid, --loglevel=info]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../../control-equipos-frontend}
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    restart: unless-stopped
    ports: ["127.0.0.1:${FRONTEND_PUBLIC_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 5
    depends_on:
      backend: {condition: service_healthy}
    networks: [control_equipos_net]
    security_opt: [no-new-privileges:true]

networks:
  control_equipos_net:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
  backups_data:
